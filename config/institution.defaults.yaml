# Default institutional configuration.
# DO NOT EDIT — copy to institution.yaml and override there.
# Values here reflect published-guideline defaults; institution.yaml is merged
# on top and wins on any overlapping key.

institution:
  name: "Default Institution"

patient:
  # Regex every patient_id must match. Default: 'PT-' followed by 3+ digits.
  id_regex: '^PT-\d{3,}$'

cycles:
  # Which dose-density options appear in the patient-edit dropdown.
  dose_density_options:
    - standard_q3w
    - dose_dense_q2w

backup:
  # Reminder cadence for the backup/restore story in Sprint 10.
  reminder_interval_days: 7

cardiotoxicity:
  bsa_formula: mosteller           # mosteller | dubois
  weight_change_warning_pct: 10

  cumulative_thresholds_mg_per_m2:
    yellow: 300
    red: 400
    hard_stop: 450

  equivalence_factors:             # relative to doxorubicin (1.0)
    doxorubicin: 1.0
    epirubicin: 0.5
    daunorubicin: 0.5
    idarubicin: 5.0
    mitoxantrone: 4.0

  lvef:
    absolute_hold_pct: 50
    delta_hold_pct: 10
    delta_hold_absolute_ceiling_pct: 55
    review_flag_delta_pct: 16

  blocking_modes:
    cumulative_yellow: advisory
    cumulative_red: soft_block
    cumulative_hard_stop: hard_block
    lvef_absolute: soft_block
    lvef_delta: soft_block

toxicity:
  ctcae_version: "5.0"

  neuropathy:
    grade_actions:
      0: { dose_pct: 100, action: continue }
      1: { dose_pct: 100, action: continue }
      2: { dose_pct: 80,  action: hold_one_cycle_then_resume }
      3: { dose_pct: 75,  action: hold_until_recovered_then_resume_discontinue_on_recurrence }
      4: { dose_pct: 0,   action: discontinue_permanently }
    use_higher_grade_for_action: true

  infusion_reactions:
    symptom_vocab:
      - flushing
      - urticaria
      - hypotension
      - hypertension
      - dyspnea
      - bronchospasm
      - back_pain
      - chest_pain
      - anaphylaxis
    rechallenge_policy:
      1: { rechallenge: true,  rate_pct: 50, premed_enhance: false }
      2: { rechallenge: true,  rate_pct: 50, premed_enhance: true }
      3: { rechallenge: false, switch_agent_to: nab_paclitaxel_or_docetaxel }
      4: { rechallenge: false, switch_agent_to: nab_paclitaxel_or_docetaxel, hard_block: true }

  gcsf:
    agent_vocab: [pegfilgrastim, filgrastim, lipegfilgrastim]
    policy:
      dose_dense_q2w: primary
      standard_q3w: secondary
    stimulated_window_days: 7

  symptoms:
    set_all_phases: [nausea, fatigue, mucositis, constipation]
    set_t_phase_additional: [arthralgia, peripheral_edema]
    advisory_grade: 3

  blocking_modes:
    neuropathy_grade_2: advisory
    neuropathy_grade_3_before_t: soft_block
    neuropathy_grade_4: hard_block
    infusion_reaction_grade_4: hard_block
    symptoms_grade_3_or_higher: advisory

scheduling:
  cadence_days:
    standard_q3w: 21
    dose_dense_q2w: 14
  due_within_days: 7
  overdue_after_days: 0

labs:
  freshness_hours: 72

precycle:
  anc:
    ac:        { min_per_uL: 1500 }
    t:         { min_per_uL: 1500 }
    dose_dense_from_cycle_2: { min_per_uL: 1000 }
  platelets:
    min_per_uL: 100000
  active_infection:
    require_nurse_attestation: true
  neuropathy_t_phase_max_grade: 1
  symptoms_advisory_grade: 3

  blocking_modes:
    anc_below_threshold:        soft_block
    platelets_below_threshold:  soft_block
    labs_stale:                 advisory
    active_infection:           soft_block
    cumulative_red:             soft_block
    cumulative_hard_stop:       hard_block
    lvef_abnormal:              soft_block
    neuropathy_t_above_max:     soft_block
    symptoms_grade_3_or_higher: advisory

alerts:
  low_anc_banner:
    red_below_per_uL: 500
    orange_below_per_uL: 1000
    dismiss_scope: session

reports:
  page_size: letter
  margin_in: 0.5
  branding:
    institution_name: ""
    logo_path: ""
    footer_text: "Generated by Chemotherapy Dashboard"

  audiences:
    oncologist: { enabled: true,  must_ship: true  }
    pcp:        { enabled: true,  must_ship: false }
    patient:    { enabled: true,  must_ship: false }

  oncologist:
    include_anc_chart: true
    chart_size_in: [4.0, 2.0]
    recent_activity_days: 90
    show_audit_summary: true

  pcp:
    include_referral_guidance: true
    reading_level: clinical

  patient:
    reading_level: plain_6th_grade
    expand_acronyms: true

  print_dashboard:
    orientation: portrait
    recent_activity_days: 90

  csv:
    labs:
      columns:
        - date
        - anc
        - hgb
        - plt
        - wbc
        - neut_pct
        - gcsf_within_7d
        - notes
      filename_pattern: "labs_{patient_id}_{YYYY_MM_DD}.csv"
      include_soft_deleted: false

exports:
  audit_actions:
    pdf: export_pdf
    csv: export_csv
